<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100"
     aria-hidden="true" focusable="false">
  <!--
    Footer panorama — readable at 80px height.
    Left → right: mountains, beach, LA, Melbourne, London, Saigon.
  -->

  <!-- Ground -->
  <line x1="0" y1="95" x2="1440" y2="95"
        stroke="#6B6460" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- ── Mountains + coast ─────────────────────────────────── -->
  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,95 L55,52 L110,68 L165,32 L220,58 L280,95"
          stroke-width="1" opacity="0.22"/>
    <path d="M0,95 L75,60 L145,42 L210,62 L280,95"
          stroke-width="1.1" opacity="0.38"/>
    <path d="M30,95 L100,64 L175,48 L250,95"
          stroke-width="1.2" opacity="0.55"/>

    <!-- Beach -->
    <path d="M0,95 C90,86 170,90 280,95"
          stroke-width="1.2" opacity="0.45"/>
    <path d="M20,92 C110,84 190,88 270,93"
          stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ── LA ────────────────────────────────────────────────── -->
  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">
    <!-- Palm -->
    <path d="M318,95 Q322,68 326,46" stroke-width="1.2"/>
    <path d="M326,46 C318,40 310,38 326,46 C342,38 334,40 326,46" stroke-width="1"/>
    <path d="M326,46 V32 M326,46 L312,50 M326,46 L340,50" stroke-width="1"/>

    <!-- Downtown -->
    <path d="M350,95 V62 H372 V95" stroke-width="1.2"/>
    <path d="M378,95 V50 H400 V95" stroke-width="1.2"/>
    <path d="M406,95 V56 H426 V95" stroke-width="1.2"/>

    <!-- City Hall ziggurat -->
    <path d="M438,95 V80 H468 V95" stroke-width="1.4"/>
    <path d="M434,80 H472 V74 H466 V80" stroke-width="1.3"/>
    <path d="M440,74 H466 V68 H460 V74" stroke-width="1.3"/>
    <path d="M446,68 H460 V62 H454 V68" stroke-width="1.3"/>
    <path d="M450,62 V50" stroke-width="1.4"/>
  </g>

  <!-- ── Melbourne ─────────────────────────────────────────── -->
  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Flinders Street Station -->
    <path d="M520,95 V72 H700 V95" stroke-width="1.3"/>
    <path d="M514,72 C545,64 575,58 610,56 C645,58 675,64 706,72" stroke-width="1.3"/>
    <path d="M582,72 V48 H638 V72" stroke-width="1.4"/>
    <path d="M576,48 C592,42 610,39 610,39 C610,39 628,42 644,48" stroke-width="1.3"/>
    <path d="M548,95 V80 H572 V95" stroke-width="1.1"/>
    <path d="M648,95 V80 H672 V95" stroke-width="1.1"/>

    <!-- Eureka Tower -->
    <path d="M718,95 V28 H736 V95" stroke-width="1.5"/>
    <path d="M712,28 H742 L730,18 L718,28" stroke-width="1.3"/>

    <!-- Arts Centre spire -->
    <path d="M754,95 V70 H762 V95" stroke-width="1.2"/>
    <path d="M758,70 V38" stroke-width="1.4"/>
    <path d="M758,38 L752,46 M758,38 L764,46 M758,38 V24" stroke-width="1.2"/>
  </g>

  <!-- ── London ────────────────────────────────────────────── -->
  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">
    <!-- London Eye -->
    <circle cx="820" cy="66" r="22" stroke-width="1.2" opacity="0.55"/>
    <path d="M808,88 V95 M820,88 V95 M832,88 V95" stroke-width="1" opacity="0.5"/>

    <!-- Terraces -->
    <path d="M858,95 V78 H882 V95" stroke-width="1.1"/>
    <path d="M858,78 L870,72 L882,78" stroke-width="1.1"/>
  </g>

  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- Big Ben -->
    <path d="M900,95 V34 H934 V95" stroke-width="1.6"/>
    <path d="M896,34 H938 V28 H934 V34" stroke-width="1.4"/>
    <path d="M906,34 V24 H928 V34" stroke-width="1.3"/>
    <circle cx="917" cy="52" r="6" stroke-width="1.3"/>
    <path d="M917,34 V16 M912,22 L917,16 L922,22" stroke-width="1.3"/>
    <path d="M908,95 V76 H926 V95" stroke-width="1.2"/>

    <!-- Tower Bridge -->
    <path d="M952,95 V74 H964 V95 M976,95 V74 H988 V95" stroke-width="1.2"/>
    <path d="M948,74 C956,68 964,66 970,66 C976,66 984,68 992,74" stroke-width="1.1"/>
  </g>

  <!-- ── Saigon ────────────────────────────────────────────── -->
  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">
    <!-- Phố cổ tube houses -->
    <path d="M1030,95 V60 H1050 V95 M1050,95 V52 H1072 V95 M1072,95 V66 H1090 V95" stroke-width="1.2"/>
    <rect x="1033" y="66" width="8" height="6" fill="none" stroke="#6B6460" stroke-width="0.9"/>
    <rect x="1053" y="58" width="8" height="6" fill="none" stroke="#6B6460" stroke-width="0.9"/>

    <!-- French colonial -->
    <path d="M1100,95 V56 H1240 V95" stroke-width="1.3"/>
    <path d="M1096,56 L1170,38 L1244,56" stroke-width="1.3"/>
    <path d="M1124,56 V44 H1140 V56 L1132,36 Z" stroke-width="1.1"/>
    <path d="M1200,56 V44 H1216 V56 L1208,36 Z" stroke-width="1.1"/>
    <path d="M1112,82 V72 Q1124,66 1136,72 V82" stroke-width="1"/>
    <path d="M1148,82 V72 Q1160,66 1172,72 V82" stroke-width="1"/>
    <path d="M1184,82 V72 Q1196,66 1208,72 V82" stroke-width="1"/>
    <path d="M1220,82 V72 Q1232,66 1244,72 V82" stroke-width="1"/>
    <line x1="1100" y1="84" x2="1240" y2="84" stroke-width="1"/>

    <!-- Bitexco -->
    <path d="M1256,95 V54 H1278 V95" stroke-width="1.4"/>
    <path d="M1250,54 H1284 L1267,34 L1250,54" stroke-width="1.3"/>

    <!-- Pagoda -->
    <path d="M1296,95 V78 H1368 V95" stroke-width="1.3"/>
    <path d="M1290,74 L1296,78 H1368 L1374,74" stroke-width="1.2"/>
    <path d="M1306,78 V62 H1358 V78" stroke-width="1.2"/>
    <path d="M1300,58 L1306,62 H1358 L1364,58" stroke-width="1.1"/>
    <path d="M1314,62 V48 H1350 V62" stroke-width="1.2"/>
    <path d="M1308,44 L1314,48 H1350 L1356,44" stroke-width="1.1"/>
    <path d="M1322,48 V34 H1342 V48" stroke-width="1.2"/>
    <path d="M1332,34 V22 M1328,28 L1332,22 L1336,28" stroke-width="1.3"/>
  </g>

  <!-- Fade to heat haze -->
  <g fill="none" stroke="#6B6460" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1388,95 V64 H1408 V95" stroke-width="1.1" opacity="0.45"/>
    <path d="M1408,95 V72 H1426 V95" stroke-width="1" opacity="0.28"/>
    <path d="M1426,95 V58 H1440 V95" stroke-width="1" opacity="0.15"/>
  </g>
</svg>
