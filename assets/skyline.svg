<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 64"
     aria-hidden="true" focusable="false">
  <!-- Minimal horizon mark — coastal swell + fourthpin ticks -->

  <defs>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2E6E6A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2E6E6A" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="64" fill="url(#haze)"/>

  <!-- Distant ridge -->
  <path fill="none" stroke="#2E6E6A" stroke-width="1.25" stroke-linecap="round"
        opacity="0.20"
        d="M-8,34 C148,26 312,30 468,24 C624,18 792,28 948,22
           C1104,16 1268,24 1448,20"/>

  <!-- Mid swell -->
  <path fill="none" stroke="#6B6460" stroke-width="1" stroke-linecap="round"
        opacity="0.32"
        d="M0,46 C144,42 288,48 432,44 C576,40 720,47 864,43
           C1008,39 1152,45 1296,41 C1368,39 1416,43 1440,42"/>

  <!-- Shore line -->
  <path fill="none" stroke="#C9C3B8" stroke-width="1" stroke-linecap="round"
        opacity="0.55"
        d="M0,54 C240,52 480,55 720,53 C960,51 1200,54 1440,52"/>

  <!-- fourthpin — four ticks, last one in rust -->
  <g stroke-linecap="round">
    <line x1="380" y1="54" x2="380" y2="49" stroke="#C9C3B8" stroke-width="1.5" opacity="0.6"/>
    <line x1="620" y1="54" x2="620" y2="48" stroke="#6B6460" stroke-width="1.5" opacity="0.45"/>
    <line x1="860" y1="54" x2="860" y2="49" stroke="#C9C3B8" stroke-width="1.5" opacity="0.6"/>
    <line x1="1100" y1="54" x2="1100" y2="47" stroke="#A83A0A" stroke-width="1.75" opacity="0.65"/>
  </g>
</svg>
